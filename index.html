<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><link rel="manifest" href="manifest.json"><title>School Timetable Generator</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6f8;color:#17202a}button,input,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.panel{background:#fff;border:1px solid #d9e1e6;border-radius:14px;padding:18px;box-shadow:0 3px 14px #0001}.card{width:min(420px,100%)}h1,h2,h3{margin-top:0}.login h1{text-align:center;color:#087f8c}.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #ccd6db;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#087f8c;color:#fff;font-weight:bold}.blue{background:#1971c2}.red{background:#c92a2a}.light{background:#e8f1f3;color:#17404a}.small{padding:6px 9px;font-size:12px}.head{background:linear-gradient(135deg,#087f8c,#1971c2);color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.head h1{font-size:20px;margin:0}.nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:8px;position:sticky;top:60px;z-index:19;border-bottom:1px solid #ddd}.nav button{border:0;border-radius:8px;padding:9px 12px;white-space:nowrap;background:#edf3f5;font-weight:bold}.nav .active{background:#087f8c;color:#fff}main{max-width:1500px;margin:auto;padding:14px}.panel{margin-bottom:14px;box-shadow:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:16px;background:#eef8fa;border-radius:12px}.stat b{display:block;font-size:28px;color:#087f8c}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar select{width:auto;min-width:180px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d9e1e6;padding:8px}th{background:#edf5f7}.timetable{min-width:900px}.timetable th,.timetable td{text-align:center;min-width:105px;height:66px}.timetable th:first-child,.timetable td:first-child{position:sticky;left:0;background:#edf5f7;z-index:4;min-width:100px;font-weight:bold}.timetable thead th{position:sticky;top:0;z-index:5}.subject{font-weight:bold;color:#075a6a}.meta{font-size:12px;color:#5c6870}.break{background:#fff3bf!important;color:#7c5c00;font-weight:bold}.empty{color:#a0a9af}.notice{padding:10px;background:#fff3bf;border:1px solid #ffe066;border-radius:8px;margin-top:10px}.success{background:#e6fcf5;border-color:#96f2d7;color:#087f5b}.print-title{display:none;text-align:center}.print-title h2{margin:0}.print-title p{margin:4px;color:#555}footer{text-align:center;color:#68737d;font-size:12px;padding:20px}@media(max-width:700px){.grid,.grid3,.cards{grid-template-columns:1fr}.nav{top:60px}}@media print{.head,.nav,footer,.no-print{display:none!important}main{padding:0}.panel{border:0;padding:0}.print-title{display:block}.scroll{overflow:visible}.timetable{min-width:0;width:100%}.timetable th:first-child,.timetable td:first-child{position:static}.timetable th,.timetable td{font-size:10px;height:50px;padding:4px}}
</style></head><body>
<div id="login" class="login"><div class="card"><h1>School Timetable Generator</h1><p style="text-align:center">Offline timetable planning</p><form id="lf"><div class="field"><label>Username</label><input id="u" required></div><div class="field"><label>Password</label><input id="pw" type="password" required></div><button class="btn" style="width:100%">Login</button></form><p style="text-align:center;font-size:12px">Initial login: <b>admin</b> / <b>admin123</b></p><div id="lm" class="notice hide"></div></div></div>
<div id="app" class="hide"><div class="head"><div><h1 id="school">School Timetable Generator</h1><small id="year"></small></div><button id="logout" class="btn light no-print">Logout</button></div><div id="nav" class="nav no-print"></div><main id="main"></main><footer>Offline • Data stored on this phone</footer></div>
<script>
const K='timetabler_v4',L='timetabler_login_v4',D=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const loginBox=document.getElementById('login'),appBox=document.getElementById('app'),navEl=document.getElementById('nav'),mainEl=document.getElementById('main'),schoolEl=document.getElementById('school'),yearEl=document.getElementById('year');
let S=load();function fresh(){return{school:{name:'My School',year:'2026'},classes:[],teachers:[],subjects:[],assignments:[],periods:[['P1','8:00-8:40',0],['P2','8:40-9:20',0],['P3','9:20-10:00',0],['Break','10:00-10:20',1],['P4','10:20-11:00',0],['P5','11:00-11:40',0],['P6','11:40-12:20',0],['Lunch','12:20-1:20',1],['P7','1:20-2:00',0],['P8','2:00-2:40',0]],tt:{},warnings:[]}}function load(){try{return JSON.parse(localStorage.getItem(K))||fresh()}catch(e){return fresh()}}function save(){localStorage.setItem(K,JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function n(x){return String(x||'').trim().toLowerCase()}function isPPI(x){return n(x)==='ppi'}function isME(x){return ['math','mathematics','english'].includes(n(x))}function slots(){return S.periods.map((p,i)=>({p,i})).filter(x=>!x.p[2])}function lunch(){return S.periods.findIndex(p=>p[2]&&n(p[0]).includes('lunch'))}function key(d,p,c){return d+'|'+p+'|'+c}
const views=[['dash','Dashboard'],['setup','Setup'],['subjects','Subjects'],['assign','Teacher Assignments'],['periods','Periods & Breaks'],['gen','Generate'],['block','Block Timetable'],['class','Class Timetable'],['teacher','Teacher Timetable']];function buildNav(){navEl.innerHTML=views.map(v=>`<button data-v="${v[0]}">${v[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.v))}function show(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));mainEl.innerHTML=({dash,setup,subjects,assign,periods,gen,block,class:cl,teacher}[v])();bind(v);schoolEl.textContent=S.school.name||'School Timetable Generator';yearEl.textContent=S.school.year?'Academic Year: '+S.school.year:''}
function dash(){return `<section class="panel"><h2>Dashboard</h2><p>Set up your school, then generate the timetable automatically.</p><div class="cards"><div class="stat"><b>${S.classes.length}</b>Classes</div><div class="stat"><b>${S.teachers.length}</b>Teachers</div><div class="stat"><b>${S.subjects.length}</b>Subjects</div><div class="stat"><b>${S.assignments.length}</b>Assignments</div></div></section><section class="panel"><h3>Quick Actions</h3><div class="actions"><button class="btn" onclick="show('setup')">School Setup</button><button class="btn" onclick="show('subjects')">Subjects</button><button class="btn" onclick="show('assign')">Teacher Assignments</button><button class="btn blue" onclick="show('gen')">Generate Timetable</button></div></section><section class="panel"><h3>Automatic rules</h3><ul><li>PPI first lesson Friday where possible.</li><li>Mathematics and English before lunch.</li><li>No class or teacher clashes.</li><li>Subjects distributed to reduce repetition.</li></ul></section>`}
function setup(){return `<section class="panel"><h2>School Setup</h2><div class="grid"><div class="field"><label>School name</label><input id="sn" value="${esc(S.school.name)}"></div><div class="field"><label>Academic year</label><input id="sy" value="${esc(S.school.year)}"></div></div><button class="btn" id="ss">Save</button></section><section class="panel"><h3>Classes</h3><div class="toolbar"><input id="nc" placeholder="e.g. Grade 4A"><button class="btn" id="ac">Add Class</button></div>${list(S.classes,'class')}</section><section class="panel"><h3>Teachers</h3><div class="toolbar"><input id="nt" placeholder="Teacher name"><button class="btn" id="at">Add Teacher</button></div>${list(S.teachers,'teacher')}</section>`}function list(a,t){return a.length?`<div class="scroll"><table><tr><th>${t}</th><th>Action</th></tr>${a.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn red small" onclick="removeItem('${t}',${i})">Delete</button></td></tr>`).join('')}</table></div>`:`<p>No ${t}s added.</p>`}
function subjects(){return `<section class="panel"><h2>Subjects</h2><div class="toolbar"><input id="ns" placeholder="e.g. Mathematics"><button class="btn" id="addsub">Add Subject</button></div>${S.subjects.length?`<div class="scroll"><table><tr><th>Subject</th><th>Action</th></tr>${S.subjects.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn red small" onclick="removeSubject(${i})">Delete</button></td></tr>`).join('')}</table></div>`:'<p>No subjects added.</p>'}</section>`}
function assign(){return `<section class="panel"><h2>Teacher Assignments</h2><div class="grid3"><div class="field"><label>Subject</label><select id="as">${S.subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Teacher</label><select id="at2">${S.teachers.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Class</label><select id="acl">${S.classes.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><div class="field" style="max-width:220px"><label>Lessons per week</label><input id="al" type="number" min="1" max="20" value="3"></div><button class="btn" id="adda">Add Assignment</button><div id="am"></div></section><section class="panel"><h3>Current Assignments</h3>${S.assignments.length?`<div class="scroll"><table><tr><th>Subject</th><th>Teacher</th><th>Class</th><th>Lessons</th><th>Action</th></tr>${S.assignments.map((a,i)=>`<tr><td>${esc(a.s)}</td><td>${esc(a.t)}</td><td>${esc(a.c)}</td><td>${a.l}</td><td><button class="btn red small" onclick="removeA(${i})">Delete</button></td></tr>`).join('')}</table></div>`:'<p>No assignments.</p>'}</section>`}
function periods(){return `<section class="panel"><h2>Periods & Breaks</h2><div class="grid3"><div class="field"><label>Name</label><input id="pn" placeholder="P1"></div><div class="field"><label>Time</label><input id="pt" placeholder="8:00-8:40"></div><div class="field"><label>Type</label><select id="pb"><option value="0">Teaching</option><option value="1">Break</option></select></div></div><button class="btn" id="addp">Add</button><div class="scroll" style="margin-top:12px"><table><tr><th>#</th><th>Name</th><th>Time</th><th>Type</th><th>Action</th></tr>${S.periods.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td>${p[2]?'Break':'Teaching'}</td><td><button class="btn red small" onclick="removeP(${i})">Delete</button></td></tr>`).join('')}</table></div></section>`}
function gen(){return `<section class="panel"><h2>Automatic Generation</h2><p>Existing generated lessons will be replaced.</p><button class="btn blue" id="generate">Generate Automatically</button><button class="btn light" id="clear">Clear</button><div id="result"></div></section>`}
function title(t){return `<div class="print-title"><h2>${esc(S.school.name)}</h2><p>${esc(t)} • Academic Year ${esc(S.school.year)}</p></div>`}function hdr(){return `<thead><tr><th>Day</th>${S.periods.map(p=>`<th>${esc(p[0])}<br><small>${esc(p[1])}</small></th>`).join('')}</tr></thead>`}
function block(){return `<section class="panel"><div class="toolbar no-print"><button class="btn blue" onclick="print()">Print Block Timetable</button></div>${title('Block Timetable')}<div class="scroll"><table class="timetable">${hdr()}<tbody>${D.map(d=>`<tr><td>${d}</td>${S.periods.map((p,i)=>p[2]?`<td class="break">${esc(p[0])}</td>`:`<td>${S.classes.map(c=>S.tt[key(d,i,c)]).filter(Boolean).map(a=>`<div class="subject">${esc(a.s)}</div><div class="meta">${esc(a.c)} • ${esc(a.t)}</div>`).join('')||'<span class="empty">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function classTable(c){return `<div class="scroll"><table class="timetable">${hdr()}<tbody>${D.map(d=>`<tr><td>${esc(d)}</td>${S.periods.map((p,i)=>p[2]?`<td class="break">${esc(p[0])}</td>`:`<td>${S.tt[key(d,i,c)]?`<div class="subject">${esc(S.tt[key(d,i,c)].s)}</div><div class="meta">${esc(S.tt[key(d,i,c)].t)}</div>`:'<span class="empty">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function cl(){let c=S.classes[0]||'';return `<section class="panel"><div class="toolbar no-print"><b>Class:</b><select id="cs">${S.classes.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="btn blue" onclick="print()">Print Class Timetable</button></div>${title('Class Timetable')}<div id="ct">${classTable(c)}</div></section>`}
function teacherTable(t){return `<div class="scroll"><table class="timetable">${hdr()}<tbody>${D.map(d=>`<tr><td>${d}</td>${S.periods.map((p,i)=>p[2]?`<td class="break">${esc(p[0])}</td>`:`<td>${S.classes.map(c=>S.tt[key(d,i,c)]).filter(a=>a&&a.t===t).map(a=>`<div class="subject">${esc(a.s)}</div><div class="meta">${esc(a.c)}</div>`).join('')||'<span class="empty">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function teacher(){let t=S.teachers[0]||'';return `<section class="panel"><div class="toolbar no-print"><b>Teacher:</b><select id="ts">${S.teachers.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="btn blue" onclick="print()">Print Teacher Timetable</button></div>${title('Individual Teacher Timetable')}<div id="tt">${teacherTable(t)}</div></section>`}
function bind(v){if(v==='setup'){ss.onclick=()=>{S.school.name=sn.value.trim()||'My School';S.school.year=sy.value.trim();save();show('setup')};ac.onclick=()=>addSimple('class');at.onclick=()=>addSimple('teacher')}if(v==='subjects')addsub.onclick=()=>{let x=ns.value.trim();if(x&&!S.subjects.some(a=>n(a)===n(x))){S.subjects.push(x);save();show('subjects')}}if(v==='assign')adda.onclick=addAssignment;if(v==='periods')addp.onclick=()=>{if(!pn.value.trim())return;S.periods.push([pn.value.trim(),pt.value.trim(),+pb.value]);S.tt={};save();show('periods')}if(v==='gen'){generate.onclick=generateNow;clear.onclick=()=>{S.tt={};S.warnings=[];save();result.innerHTML='<div class="notice success">Timetable cleared.</div>'}}if(v==='class')cs.onchange=()=>ct.innerHTML=classTable(cs.value);if(v==='teacher')ts.onchange=()=>tt.innerHTML=teacherTable(ts.value)}
function addSimple(t){let id=t==='class'?'nc':'nt',x=document.getElementById(id).value.trim(),a=t==='class'?S.classes:S.teachers;if(x&&!a.some(y=>n(y)===n(x))){a.push(x);save();show('setup')}}function removeItem(t,i){let a=t==='class'?S.classes:S.teachers,x=a[i];a.splice(i,1);S.assignments=S.assignments.filter(q=>q.c!==x&&q.t!==x);S.tt={};save();show('setup')}function removeSubject(i){let x=S.subjects[i];S.subjects.splice(i,1);S.assignments=S.assignments.filter(a=>a.s!==x);S.tt={};save();show('subjects')}function addAssignment(){let a={s:as.value,t:at2.value,c:acl.value,l:+al.value};if(!a.s||!a.t||!a.c||!a.l){am.innerHTML='<div class="notice">Complete all fields.</div>';return}if(S.assignments.some(x=>n(x.s)===n(a.s)&&n(x.c)===n(a.c))){am.innerHTML='<div class="notice">That subject is already assigned to this class.</div>';return}S.assignments.push(a);S.tt={};save();show('assign')}function removeA(i){S.assignments.splice(i,1);S.tt={};save();show('assign')}function removeP(i){if(S.periods.length>1){S.periods.splice(i,1);S.tt={};save();show('periods')}}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateNow(){S.tt={};S.warnings=[];let ss=slots(),li=lunch(),oc={},ot={},jobs=[];S.assignments.forEach(a=>{for(let i=0;i<a.l;i++)jobs.push({...a})});for(let c of S.classes){let p=S.assignments.find(a=>a.c===c&&isPPI(a.s));if(p){let s=ss[0],k=key('Friday',s.i,c),tk='Friday|'+s.i+'|'+p.t;if(!oc[k]&&!ot[tk]){S.tt[k]={s:p.s,t:p.t,c};oc[k]=1;ot[tk]=1;let z=jobs.findIndex(j=>j.s===p.s&&j.t===p.t&&j.c===c);if(z>=0)jobs.splice(z,1)}else S.warnings.push('PPI could not be placed first on Friday for '+c)}}shuffle(jobs);for(let j of jobs){let cand=[];for(let d of D)for(let s of ss){if(isME(j.s)&&li>=0&&s.i>li)continue;let k=key(d,s.i,j.c),tk=d+'|'+s.i+'|'+j.t;if(oc[k]||ot[tk])continue;let score=Math.random()*30,pr=S.tt[key(d,s.i-1,j.c)],nx=S.tt[key(d,s.i+1,j.c)],same=Object.keys(S.tt).some(q=>q.startsWith(d+'|')&&S.tt[q].c===j.c&&S.tt[q].s===j.s);if(same)score+=180;if(pr&&pr.s===j.s)score+=500;if(nx&&nx.s===j.s)score+=500;cand.push({d,s,score})}if(!cand.length){S.warnings.push('Could not place '+j.s+' for '+j.c+' ('+j.t+').');continue}cand.sort((a,b)=>a.score-b.score);let q=cand[0],k=key(q.d,q.s.i,j.c);S.tt[k]={s:j.s,t:j.t,c:j.c};oc[k]=1;ot[q.d+'|'+q.s.i+'|'+j.t]=1}save();result.innerHTML='<div class="notice success">Timetable generated: '+Object.keys(S.tt).length+' lessons placed.</div>'+(S.warnings.length?'<div class="notice"><b>Warnings:</b><ul>'+S.warnings.map(esc).map(x=>'<li>'+x+'</li>').join('')+'</ul></div>':'<div class="notice success">No unplaced lessons reported.</div>')}
function print(){window.print()}const loginEl=loginBox,appEl=appBox,lfEl=document.getElementById('lf'),uEl=document.getElementById('u'),pwEl=document.getElementById('pw'),lmEl=document.getElementById('lm'),logoutEl=document.getElementById('logout');lfEl.addEventListener('submit',e=>{e.preventDefault();const username=uEl.value.trim(),password=pwEl.value;if(username==='admin'&&password==='admin123'){localStorage.setItem(L,'1');start()}else{lmEl.textContent='Incorrect username or password.';lmEl.classList.remove('hide')}});logoutEl.addEventListener('click',()=>{localStorage.removeItem(L);location.reload()});function start(){loginEl.classList.add('hide');appEl.classList.remove('hide');buildNav();show('dash')}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});if(localStorage.getItem(L)==='1')start();
</script></body></html>
